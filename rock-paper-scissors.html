<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="Styles/rock-paper-scissors.css">
</head>
<body class="body">
<div>
<div><p class="header"><b>Play Rock Paper Scissors Now!</b></p></div>

<div class="buttons">
    <button class = "move-button js-rock-button"><img class="move-icon" src="Images/rock-emoji.png">

    <button class = "move-button js-paper-button"><img class="move-icon" src="Images/paper-emoji.png">
    </button>

    <button class = "move-button js-scissors-button"><img class="move-icon" src="Images/scissors-emoji.png">
    </button>

    <br><button class = "move-button js-reset-button"><b>Reset Score</b>
    </button>

    <button class="auto-play-button js-autoplay-button"><b>Auto Play</b></button>
</div>

<p class="js-result"></p>
<p class="js-moves"></p>
<p class="js-score"></p>

<div>
    <p class="instructions"><b>Instructions: <br>Start the game by clicking random button and computer pick will be random. Results are shown as how many times you won, lose or tie. You can also reset the scores. If you choose auto play computer play's game on it's own.</b></p>
</div>
</div>
<script src="Scripts/rock-paper-scissors.js"> </script>   
</body>
</html>
